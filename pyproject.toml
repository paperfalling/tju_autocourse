[project]
name = "tju-autocourse"
version = "0.1.0"
description = "Automatic course selection tool for TJU"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.0",
    "loguru>=0.7.3",
    "lxml>=6.0.2",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/tju_autocourse"]
[tool.hatch.build.targets.sdist]
include = [
    "/src/tju_autocourse",
    "/tests",
    "/scripts/init.py",
    "/scripts/course_fetch.py",
    "/scripts/check_course.py",
    "/main.py",
    "/README.md",
    "/README_zh.md",
    "/docs",
    "/config.template.yaml",
    "/pyproject.toml",
    "/uv.lock",
    "/LICENSE",
]
[dependency-groups]
dev = ["coverage>=7.10.6", "pytest>=8.4.2", "ruff>=0.12.0"]

[tool.ruff]
target-version = "py313"
extend-exclude = [".uv-cache", "logs", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
