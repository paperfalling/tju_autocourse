[project]
name = "tju-autocourse"
version = "0.1.0"
description = "Automatic course selection tool for TJU"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.0",
    "loguru>=0.7.3",
    "lxml>=6.1.2",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/tju_autocourse"]
[dependency-groups]
dev = ["coverage>=7.16.0", "pytest>=9.1.1"]
