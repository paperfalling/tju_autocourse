meta:
  domain: classes.tju.edu.cn
  startTime: 1970-01-01T08:00:00
  request_interval: 0.5 # seconds between requests for one user
  auth_retries: 2 # re-login attempts after session expiry
  too_fast_retries: 2 # retries after a too-fast response

users:
- username: "your username"
  password: "your password"
  # cookie: your cookie # optional legacy mode
  targets:
  - group_name: group 1 name
    limit: -1 # -1 means no limit
    courses:
    - "course 1 no."
    - "course 2 no."
